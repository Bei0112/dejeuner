<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation à déjeuner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #fafafa;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 28px;
    }

    button {
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    #oui {
      background-color: #4CAF50;
      color: white;
      font-size: 22px;
    }

    #non {
      background-color: #f44336;
      color: white;
      font-size: 22px;
    }
  </style>
</head>
<body>

  <h1>Paul, voulez-vous déjeuner avec moi la semaine prochaine&nbsp;?</h1>

  <button id="oui">Oui</button>
  <button id="non">Non</button>

  <script>
    let clickCount = 0;
    const btnOui = document.getElementById("oui");
    const btnNon = document.getElementById("non");

    btnNon.addEventListener("click", () => {
      clickCount++;
      
      if (clickCount === 1) {
        btnOui.style.fontSize = "32px";
        btnNon.textContent = "C’est sûr ?";
        btnNon.style.fontSize = "22px";
      } else if (clickCount === 2) {
        btnOui.style.fontSize = "40px";
        btnNon.textContent = "Réfléchis encore";
        btnNon.style.fontSize = "20px";
      }
    });

    btnOui.addEventListener("click", () => {
      alert("Super ! Dis-moi quel jour tu préfères 😊");
    });
  </script>

</body>
</html>
